<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded rectangle for desktop and standalone -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  <g filter="url(#shadow)">
    <!-- Base Asset Building / Shield -->
    <path d="M120 380 L392 380 L392 410 L120 410 Z" fill="#94a3b8" rx="4"/>
    <path d="M140 350 L372 350 L372 370 L140 370 Z" fill="#cbd5e1" rx="2"/>
    <!-- Pillars representing fixed assets -->
    <rect x="160" y="220" width="36" height="120" rx="6" fill="#e2e8f0"/>
    <rect x="238" y="220" width="36" height="120" rx="6" fill="#e2e8f0"/>
    <rect x="316" y="220" width="36" height="120" rx="6" fill="#e2e8f0"/>
    <!-- Triangular pediment -->
    <polygon points="256,120 120,200 392,200" fill="url(#gold)"/>
    <!-- Calculator / Analytics depreciation chart curve overlay -->
    <path d="M178 180 Q256 260 350 330" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
    <circle cx="178" cy="180" r="10" fill="#38bdf8"/>
    <circle cx="260" cy="245" r="10" fill="#38bdf8"/>
    <circle cx="350" cy="330" r="10" fill="#38bdf8"/>
  </g>
</svg>
